<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Event Details</title>
</head>
<body>
    <button id = "home">Home</button>
    <button id = "sub">Submit</button>
    <br>
        <label>About this Event:</label>
        <span id="about"> About this Event text here</span> 
        <br>
        <label>Event Title:</label>
        <span id="title"> Event Title text here</span> 
        <br>
        <label>Desired College:</label>
        <span id="college">College Name here</span> 
        <br>
        <label>Desired Majors:</label>
        <span id="majors">Major names here</span> 
        <br>
        <label>Type:</label>
        <span id="type">Remote/Hybrid/On-Site</span> 
        <br>
        <label>Date:</label>
        <span id="date">MM/DD/YYYY</span> 
        <br>
        <label>Time:</label>
        <span id="time">HH:MM:SS AM/PM</span>
        <br>
        <label>Grade Level:</label>
        <span id="grade-level">Freshman/Sophomore/Junior/Senior</span> 
        <br>
        <label>Company Logo:</label>
        <img id="logo" src="logo-url-here" alt="Company Logo" style="width:100px;height:100px;">
        <br>

</html>
